<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>DIFAI-IDE</title>
    <style>
      html, body, #app { margin: 0; height: 100%; background: #1e1e1e; color: #ddd; font-family: Consolas, monospace; }
      #app-root { display: flex; flex-direction: column; height: 100%; }
      #body { flex: 1; min-height: 0; min-width: 0; display: flex; overflow: hidden; border-top: 1px solid #333; }
      #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

      /* Scrollbars fines et épurées (Chromium/Electron), accordées au thème sombre */
      * { scrollbar-width: thin; scrollbar-color: #3a3a3a transparent; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 4px; border: 2px solid transparent; background-clip: content-box; }
      ::-webkit-scrollbar-thumb:hover { background: #555; background-clip: content-box; }
      ::-webkit-scrollbar-corner { background: transparent; }
      .xterm-viewport::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 4px; }

      #header { display: flex; align-items: center; justify-content: space-between; height: 36px; box-sizing: border-box; padding: 0 10px; padding-right: 145px; background: #121212; -webkit-app-region: drag; }
      #header .brand { font-weight: bold; color: #7fd; }
      .sound-toggle { background: none; border: 1px solid #444; border-radius: 6px; color: #ddd; cursor: pointer; padding: 2px 8px; font-family: inherit; -webkit-app-region: no-drag; }

      .tab { position: relative; flex: none; display: flex; align-items: center; gap: 6px; padding: 4px 9px; background: #1e1e1e; border: 1px solid #333; border-bottom: none; border-radius: 6px 6px 0 0; cursor: pointer; white-space: nowrap; font-size: 12px; min-width: 0; }
      .tab-pin { display: inline-flex; color: #ddd; flex: none; }
      .tab.act { background: #23262b; border-color: #c80; margin-bottom: -1px; padding-bottom: 5px; position: relative; z-index: 1; }
      .tab-title { color: #ddd; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tab-agents { color: #888; font-size: 11px; }
      .tab-close { color: #888; }
      .tab-close:hover { color: #f66; }
      .tab-new { position: relative; align-self: flex-end; margin-bottom: -1px; }
      .tab-new button { display: inline-flex; align-items: center; justify-content: center; background: none; border: 1px dashed #444; border-bottom: unset; border-radius: 6px 6px 0 0; color: #9c9; cursor: pointer; padding: 5px 11px; font-family: inherit; font-size: 13px; line-height: 16px; }
      .tab-new-menu { position: absolute; top: 30px; left: 0; background: #202227; border: 1px solid #3a3d44; border-radius: 6px; overflow: hidden; width: 220px; z-index: 5; }
      .tab-new-menu div { padding: 6px 10px; cursor: pointer; }
      .tab-new-menu div:hover { background: #2a2d33; }

      .statedot { font-size: 10px; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      .blink { animation: blink 1s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
      .pulse { animation: pulse 1.4s ease-in-out infinite; }

      #sidebar { width: 230px; min-width: 230px; background: #161616; border-right: 1px solid #333; display: flex; flex-direction: column; }
      .sidebar-scroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
      .group-head { position: relative; display: flex; align-items: center; gap: 4px; padding: 6px 8px; color: var(--gt, #9aa); font-size: 12px; background: var(--gc, transparent); }
      .group.active-group > .group-head { color: var(--gt, #cfe); background: var(--gc, #202020); }
      .group-chevron { cursor: pointer; width: 12px; flex: none; }
      .group-name-wrap { flex: 1; cursor: pointer; overflow: hidden; }
      .group-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .group-actions { display: flex; gap: 6px; opacity: 0; flex: none; }
      .group-head:hover .group-actions { opacity: 1; }
      .ic-btn { cursor: pointer; color: #888; user-select: none; display: inline-flex; align-items: center; }
      .ic-btn:hover { color: #fff; }
      .item { position: relative; display: flex; align-items: center; gap: 6px; padding: 4px 8px 4px 22px; font-size: 12px; cursor: pointer; color: #ccc; }
      .item .item-ic { color: #9bd; display: inline-flex; flex: none; }
      .item .item-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .item .item-pin { width: 13px; flex: none; display: inline-flex; justify-content: center; color: #ddd; }
      .item .item-state { width: 13px; flex: none; display: inline-flex; justify-content: center; }
      .item .off { color: #666; }
      .item .item-menu { flex: none; opacity: 0; }
      .item:hover .item-menu { opacity: 1; }
      .item:hover { background: #202020; }
      .item.active-group-item { background: var(--gc, #202020); color: var(--gt, #ccc); }
      .item.active-group-item:hover { background: var(--gcd, #262626); color: var(--gtd, #ccc); }
      .item.active-item { background: var(--gcd, #2a2a2a); color: var(--gtd, #ccc); box-shadow: inset 3px 0 0 #c80; }
      /* Icônes d'action et épingle : suivent la couleur de contraste sur fond coloré (fallback = styles neutres). */
      .group-head .ic-btn { color: var(--gt, #888); }
      .group-head .ic-btn:hover { color: var(--gt, #fff); }
      .item.active-group-item .ic-btn { color: var(--gt, #888); }
      .item.active-group-item .ic-btn:hover { color: var(--gt, #fff); }
      .item.active-item .ic-btn { color: var(--gtd, #888); }
      .item.active-item .ic-btn:hover { color: var(--gtd, #fff); }
      .item.active-group-item .item-pin { color: var(--gt, #ddd); }
      .item.active-item .item-pin { color: var(--gtd, #ddd); }
      .inline-edit { flex: 1; min-width: 0; background: #0d0d0d; border: 1px solid #c80; border-radius: 3px; color: #ddd; font-family: inherit; font-size: 12px; padding: 1px 4px; outline: none; }
      .new-group { padding: 8px; color: #9c9; cursor: pointer; border-top: 1px solid #2a2a2a; margin-top: auto; }
      .new-group:hover { color: #cfc; }
      .ctx-menu { position: absolute; top: 24px; right: 6px; z-index: 20; background: #202227; border: 1px solid #3a3d44; border-radius: 6px; overflow: hidden; min-width: 160px; }
      .ctx-menu div { display: flex; align-items: center; gap: 8px; padding: 6px 10px; cursor: pointer; font-size: 12px; color: #ddd; }
      .ctx-menu div:hover { background: #2a2d33; }
      .ctx-menu div svg { color: #9ab; flex: none; }
      .ctx-menu div.danger { color: #f77; }
      .ctx-menu div.danger svg { color: #f77; }
      .tab-ic { color: #9bd; display: inline-flex; }
      .tab-new-menu div { display: flex; align-items: center; gap: 8px; }
      .tab-new-menu div svg { color: #9ab; flex: none; }
      .sound-toggle { display: inline-flex; align-items: center; justify-content: center; }
      #panes { flex: 1; min-height: 0; min-width: 0; display: flex; overflow: hidden; }
      .pane { display: flex; flex-direction: column; min-width: 0; height: 100%; }
      .pane-tabstrip { display: flex; align-items: flex-end; gap: 5px; padding: 6px 8px 0; background: #181818; border-bottom: 1px solid #333; min-height: 34px; }
      .tab-row { flex: 1; min-width: 0; display: flex; align-items: flex-end; gap: 5px; overflow: hidden; }
      .tab-controls { flex: none; display: flex; align-items: flex-end; gap: 5px; }
      .tab-overflow { position: relative; align-self: flex-end; margin-bottom: -1px; }
      .tab-overflow button { display: inline-flex; align-items: center; justify-content: center; background: none; border: 1px solid #444; border-bottom: unset; border-radius: 6px 6px 0 0; color: #9c9; cursor: pointer; padding: 5px 9px; font-family: inherit; font-size: 12px; line-height: 16px; }
      .tab-overflow-menu { position: absolute; top: 30px; right: 0; background: #202227; border: 1px solid #3a3d44; border-radius: 6px; overflow-y: auto; max-height: 320px; min-width: 200px; z-index: 20; }
      .tab-overflow-menu div { display: flex; align-items: center; gap: 8px; padding: 6px 10px; cursor: pointer; font-size: 12px; color: #ddd; white-space: nowrap; }
      .tab-overflow-menu div:hover { background: #2a2d33; }
      .tab-overflow-menu div.sel { color: #fc8; }
      .tab-overflow-menu .ovf-add { border-top: 1px solid #3a3d44; color: #9c9; }
      .tab-overflow-menu .ovf-add svg { color: #9ab; flex: none; }
      .pane-body { flex: 1; min-height: 0; position: relative; display: flex; }
      .body-slot { position: absolute; inset: 0; }
      .tab.aux { background: #1a1d22; border-color: #2f3a44; color: #9cc; }
      .tab.aux.act { background: #23262b; border-color: #c80; }
      .drop-zone { flex: none; width: 180px; min-width: 120px; align-self: stretch; display: flex; align-items: center; justify-content: center; margin: 8px; border: 2px dashed #c80; border-radius: 8px; color: #c80; font-size: 12px; background: rgba(204, 136, 0, 0.06); }
      .term-screen { flex: 1; min-width: 0; width: 100%; height: 100%; }

      .search-panel { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #1b1b1b; }
      .pane-body > .search-panel, .pane-body > .agents-tab { position: absolute; inset: 0; }
      .search-header { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid #333; background: #1e1e1e; }
      .search-header input { flex: 1; background: #161616; border: 1px solid #444; border-radius: 4px; color: #ddd; font-family: inherit; font-size: 12px; padding: 4px 8px; outline: none; }
      .search-header input:focus { border-color: #c80; }
      .search-close { background: none; border: none; color: #aaa; cursor: pointer; font-size: 13px; padding: 2px 4px; }
      .search-close:hover { color: #f66; }
      .search-summary { padding: 4px 8px; color: #888; font-size: 11px; border-bottom: 1px solid #2a2a2a; }
      .search-results { flex: 1; min-height: 0; overflow-y: auto; }
      .search-msg { padding: 7px 8px; border-bottom: 1px solid #262626; }
      .search-role { font-size: 10px; text-transform: uppercase; margin-bottom: 3px; color: #888; }
      .search-role.user { color: #9c9; }
      .search-role.assistant { color: #7fd; }
      .search-text { color: #cde; font-size: 11px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
      .search-text mark { background: #cc8800; color: #1e1e1e; border-radius: 2px; padding: 0 1px; }

      .splitter { flex: none; width: 5px; cursor: col-resize; background: #2a2a2a; }
      .splitter:hover { background: #c80; }
      .console { flex: 1; min-width: 0; overflow-y: auto; font-size: 12px; }
      .rail { width: 150px; border-left: 1px solid #333; overflow-y: auto; background: #181818; }
      .agents-tab { display: flex; flex: 1; min-width: 0; height: 100%; }
      .agents-tab .rail { border-left: none; border-right: 1px solid #333; flex: none; }
      .agents-tab .console { flex: 1; min-width: 0; overflow-y: auto; }
      .rail-empty { padding: 8px; color: #666; font-size: 11px; }
      .console-empty { padding: 10px; color: #666; font-size: 12px; }
      .agent { position: relative; padding: 6px 8px; border-bottom: 1px solid #2a2a2a; cursor: pointer; font-size: 11px; }
      .agent:hover { background: #242424; }
      .agent.sel { background: #33291a; outline: 1px solid #c80; }
      .agent .type { color: #7fd; }
      .agent .desc { color: #aaa; }
      .agent.done .type { color: #888; }
      .agent.done .desc { color: #777; }
      .aclose { position: absolute; top: 4px; right: 6px; font-size: 10px; opacity: 0; cursor: pointer; color: #888; user-select: none; }
      .agent:hover .aclose { opacity: 1; }
      .aclose:hover { color: #f66; }
      .cline { white-space: pre-wrap; line-height: 1.4; }
      .cline.tool { color: #fb7; }
      .cline.text { color: #cde; }
      .cline.prompt { color: #9c9; }
      .cline.result { color: #888; }
      .console-header { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 5px 8px; background: #1e1e1e; border-bottom: 1px solid #333; color: #7fd; font-size: 11px; }
      .console-body { padding: 6px 8px; }
      .cclose { cursor: pointer; color: #888; user-select: none; }
      .cclose:hover { color: #f66; }
      .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
      .modal { background: #1e1e1e; border: 1px solid #3a3d44; border-radius: 10px; min-width: 360px; max-width: 520px; max-height: 80vh; overflow: auto; box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
      .modal-title { padding: 12px 16px; font-weight: bold; color: #cfe; border-bottom: 1px solid #333; }
      .modal-body { padding: 14px 16px; color: #ddd; font-size: 13px; }
      .modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 16px; border-top: 1px solid #333; }
      .modal-msg { margin: 0 0 8px; color: #bbb; }
      .modal-list { margin: 6px 0 0; padding-left: 18px; color: #fc8; }
      .modal-list li { margin: 2px 0; }
      .btn { background: #2a2d33; border: 1px solid #444; border-radius: 6px; color: #ddd; cursor: pointer; padding: 5px 12px; font-family: inherit; font-size: 12px; }
      .btn:hover { background: #33373e; }
      .btn.primary { border-color: #c80; color: #fc8; }
      .btn.danger { border-color: #a33; color: #f88; }
      .btn.danger:hover { background: #3a2020; }
      .setting-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #2a2a2a; }
      .setting-row:last-child { border-bottom: none; }
      .setting-label { flex: 1; }
      .setting-path { color: #9bd; font-size: 11px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .toggle { background: #2a2d33; border: 1px solid #444; border-radius: 12px; color: #aaa; cursor: pointer; padding: 3px 12px; font-family: inherit; font-size: 11px; }
      .toggle.on { border-color: #c80; color: #fc8; background: #33291a; }
      .swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; margin-bottom: 12px; }
      .swatch { width: 100%; aspect-ratio: 1; border: 2px solid transparent; border-radius: 6px; cursor: pointer; padding: 0; }
      .swatch.sel { border-color: #fff; }
      .color-wheel-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; color: #bbb; font-size: 12px; }
      .color-wheel-row input[type=color] { width: 48px; height: 28px; background: none; border: 1px solid #444; border-radius: 6px; cursor: pointer; padding: 0; }
      .color-preview { display: flex; flex-direction: column; gap: 3px; }
      .cp-head { padding: 6px 10px; border-radius: 6px 6px 0 0; font-weight: bold; font-size: 12px; }
      .cp-item { padding: 5px 10px; font-size: 12px; }
      .settings-section-title { margin: 14px 0 4px; padding-top: 10px; border-top: 1px solid #333; font-weight: bold; color: #cfe; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
      .ado-empty { color: #888; font-size: 12px; padding: 8px 0; }
      .ado-conn-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #2a2a2a; font-size: 12px; }
      .ado-conn-label { font-weight: bold; color: #ddd; }
      .ado-conn-url { flex: 1; color: #9bd; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .ado-conn-status { color: #8c8; font-size: 11px; }
      .ado-conn-edit { display: flex; flex-direction: column; gap: 8px; padding: 10px 0; }
      .ado-conn-edit-actions { display: flex; gap: 8px; }
      .ado-input { background: #161616; border: 1px solid #444; border-radius: 6px; color: #ddd; padding: 6px 10px; font-family: inherit; font-size: 12px; }
      .ado-input:focus { outline: none; border-color: #c80; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
