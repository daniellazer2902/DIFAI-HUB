<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:" />
    <title>DIFAI-IDE</title>
    <style>
      :root{
        /* Fonds */
        --bg:#0a0a0a; --surface:#171717; --surface-2:#262626; --elevated:#1c1c1c;
        /* Texte (alphas de blanc) */
        --text:#ffffff; --text-2:rgba(255,255,255,.74); --text-3:rgba(255,255,255,.56); --text-muted:rgba(255,255,255,.42);
        /* Bordures / surfaces translucides */
        --border:rgba(255,255,255,.08); --border-2:rgba(255,255,255,.12); --border-hover:rgba(255,255,255,.18);
        --card:rgba(255,255,255,.02); --card-hover:rgba(255,255,255,.045); --ghost-hover:rgba(255,255,255,.06); --fill-active:rgba(255,255,255,.07);
        /* Accent neutre global (éléments NON liés à un groupe) */
        --accent:#f3f3f3; --accent-ink:#0a0a0a; --accent-soft:rgba(255,255,255,.08); --ring:rgba(255,255,255,.34);
        /* Sémantique (états, badges, callouts) */
        --ok:#5fe0a8; --info:#4f93ff; --warn:#ffb43b; --err:#ff5c5c; --purple:#b47bff;
        /* Pastilles d'état (vocabulaire app, conservé) */
        --st-starting:#9ccfff; --st-active:#ffb43b; --st-waiting:#5fe0a8; --st-attention:#ff5c5c; --st-done:#7a7a7a;
        /* Rayons */
        --r-sm:6px; --r:8px; --r-btn:10px; --r-card:12px;
        /* Polices */
        --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI Variable Text","Segoe UI",Roboto,sans-serif;
        --mono:ui-monospace,"Cascadia Code","JetBrains Mono",Consolas,"SF Mono",monospace;
        --ease:cubic-bezier(.4,0,.2,1);
      }
      html, body, #app { margin: 0; height: 100%; background: var(--bg); color: var(--text-2); font-family: var(--sans); }
      #app-root { display: flex; flex-direction: column; height: 100%; }
      #body { flex: 1; min-height: 0; min-width: 0; display: flex; overflow: hidden; border-top: 1px solid var(--border); }
      #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

      /* Scrollbars fines et épurées (Chromium/Electron), accordées au thème sombre */
      * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; border: 2px solid transparent; background-clip: content-box; }
      ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); background-clip: content-box; }
      ::-webkit-scrollbar-corner { background: transparent; }
      .xterm-viewport::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

      #header { display: flex; align-items: center; justify-content: space-between; height: 36px; box-sizing: border-box; padding: 0 10px; padding-right: 145px; background: var(--surface); -webkit-app-region: drag; }
      #header .brand { font-weight: bold; color: var(--text); }
      .sound-toggle { background: none; border: 1px solid var(--border); border-radius: var(--r); color: var(--text-3); cursor: pointer; padding: 2px 8px; font-family: inherit; -webkit-app-region: no-drag; }
      .sound-toggle:hover { background: var(--ghost-hover); color: var(--text); }

      .tab { position: relative; flex: none; display: flex; align-items: center; gap: 6px; padding: 4px 9px; background: var(--bg); border: 1px solid var(--border); border-bottom: none; border-radius: var(--r) var(--r) 0 0; cursor: pointer; white-space: nowrap; font-size: 12px; min-width: 0; color: var(--text-3); transition: background .15s var(--ease), border-color .15s var(--ease), color .15s var(--ease); }
      .tab-pin { display: inline-flex; color: var(--text-2); flex: none; }
      .tab.act { background: var(--card); color: var(--text); border-color: var(--border-2); border-bottom-color: var(--gc, var(--accent)); margin-bottom: -1px; padding-bottom: 5px; position: relative; z-index: 1; }
      .tab-title { color: inherit; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tab-agents { color: var(--text-3); font-size: 11px; }
      .tab-close { color: var(--text-3); }
      .tab-close:hover { color: var(--err); }
      .tab-new { position: relative; align-self: flex-end; margin-bottom: -1px; }
      .tab-new button { display: inline-flex; align-items: center; justify-content: center; background: none; border: 1px dashed var(--border-2); border-bottom: unset; border-radius: var(--r) var(--r) 0 0; color: var(--text-3); cursor: pointer; padding: 5px 11px; font-family: inherit; font-size: 13px; line-height: 16px; }
      .tab-new button:hover { color: var(--text); border-color: var(--border-hover); }
      .tab-new-menu { position: absolute; top: 30px; left: 0; background: var(--surface); border: 1px solid var(--border-2); border-radius: var(--r); overflow: hidden; width: 220px; z-index: 5; }
      .tab-new-menu div { padding: 6px 10px; cursor: pointer; font-size: 12px; color: var(--text-2); }
      .tab-new-menu div:hover { background: var(--ghost-hover); }

      .statedot { font-size: 10px; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      .blink { animation: blink 1s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
      .pulse { animation: pulse 1.4s ease-in-out infinite; }

      #sidebar { width: 250px; min-width: 250px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
      .sidebar-scroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
      .group-head { position: relative; display: flex; align-items: center; gap: 4px; padding: 6px 8px; color: var(--text-3); font-size: 12px; text-transform: uppercase; background: var(--gc, transparent); }
      .group.active-group > .group-head { color: var(--text-2); background: var(--gc, var(--ghost-hover)); }
      .group-chevron { cursor: pointer; width: 12px; flex: none; }
      .group-name-wrap { flex: 1; cursor: pointer; overflow: hidden; }
      .group-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .group-actions { display: flex; gap: 6px; opacity: 0; flex: none; }
      .group-head:hover .group-actions { opacity: 1; }
      .group-head { cursor: grab; }
      .group-head:active { cursor: grabbing; }
      .group.drag-over-group { box-shadow: inset 0 2px 0 0 var(--gc, var(--accent)); }
      .ic-btn { cursor: pointer; color: var(--text-muted); user-select: none; display: inline-flex; align-items: center; }
      .ic-btn:hover { color: var(--text); }
      .item { position: relative; display: flex; align-items: center; gap: 6px; margin: 1px 6px 1px 12px; padding: 0 8px; height: 31px; border-radius: var(--r); font-size: 12px; cursor: pointer; color: var(--text-3); }
      .item .item-ic { color: #9bd; display: inline-flex; flex: none; }
      .item .item-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .item .item-pin { width: 13px; flex: none; display: inline-flex; justify-content: center; color: #ddd; }
      .item .item-state { width: 13px; flex: none; display: inline-flex; justify-content: center; }
      .item .off { color: #666; }
      .item .item-menu { flex: none; opacity: 0; }
      .item:hover .item-menu { opacity: 1; }
      .item:hover { background: var(--ghost-hover); color: var(--text-2); }
      .item.active-group-item { background: var(--gc, var(--fill-active)); color: var(--gt, var(--text)); }
      .item.active-group-item:hover { background: var(--gcd, var(--fill-active)); color: var(--gtd, var(--text)); }
      .item.active-item { background: var(--gcd, var(--fill-active)); color: var(--gtd, var(--text)); }
      /* Icônes d'action et épingle : suivent la couleur de contraste sur fond coloré (fallback = styles neutres). */
      .group-head .ic-btn { color: var(--gt, var(--text-muted)); }
      .group-head .ic-btn:hover { color: var(--gt, var(--text)); }
      .item.active-group-item .ic-btn { color: var(--gt, var(--text-muted)); }
      .item.active-group-item .ic-btn:hover { color: var(--gt, var(--text)); }
      .item.active-item .ic-btn { color: var(--gtd, var(--text-muted)); }
      .item.active-item .ic-btn:hover { color: var(--gtd, var(--text)); }
      .item.active-group-item .item-pin { color: var(--gt, #ddd); }
      .item.active-item .item-pin { color: var(--gtd, #ddd); }
      .item.active-group-item .off { color: var(--gt, #666); }
      .item.active-item .off { color: var(--gtd, #666); }
      .inline-edit { flex: 1; min-width: 0; background: var(--surface-2); border: 1px solid var(--ring); border-radius: var(--r-sm); color: var(--text); font-family: inherit; font-size: 12px; padding: 1px 4px; outline: none; }
      .new-group { padding: 8px; color: var(--text-3); cursor: pointer; border-top: 1px solid var(--border); margin-top: auto; }
      .new-group:hover { color: var(--text); }
      .ctx-menu { position: absolute; top: 24px; right: 6px; z-index: 20; background: var(--surface); border: 1px solid var(--border-2); border-radius: var(--r); overflow: hidden; min-width: 160px; }
      .ctx-menu div { display: flex; align-items: center; gap: 8px; padding: 6px 10px; cursor: pointer; font-size: 12px; color: var(--text-2); }
      .ctx-menu div:hover { background: var(--ghost-hover); }
      .ctx-menu div svg { color: #9ab; flex: none; }
      .ctx-menu div.danger { color: var(--err); }
      .ctx-menu div.danger svg { color: var(--err); }
      .tab-ic { color: #9bd; display: inline-flex; }
      .tab-new-menu div { display: flex; align-items: center; gap: 8px; }
      .tab-new-menu div svg { color: #9ab; flex: none; }
      .sound-toggle { display: inline-flex; align-items: center; justify-content: center; }
      #panes { flex: 1; min-height: 0; min-width: 0; display: flex; overflow: hidden; }
      /* Un conteneur par groupe (display:flex si actif, none sinon) : garde tous les terminaux montés. */
      .group-panes { flex: 1; min-height: 0; min-width: 0; overflow: hidden; }
      .pane { display: flex; flex-direction: column; min-width: 0; height: 100%; }
      .pane-tabstrip { display: flex; align-items: flex-end; gap: 5px; padding: 6px 8px 0; background: var(--bg); border-bottom: 1px solid var(--border); min-height: 34px; }
      .tab-row { flex: 1; min-width: 0; display: flex; align-items: flex-end; gap: 5px; overflow: hidden; }
      .tab-controls { flex: none; display: flex; align-items: flex-end; gap: 5px; }
      .tab-overflow { position: relative; align-self: flex-end; margin-bottom: -1px; }
      .tab-overflow button { display: inline-flex; align-items: center; justify-content: center; background: none; border: 1px solid var(--border-2); border-bottom: unset; border-radius: var(--r) var(--r) 0 0; color: var(--text-3); cursor: pointer; padding: 5px 9px; font-family: inherit; font-size: 12px; line-height: 16px; }
      .tab-overflow button:hover { color: var(--text); border-color: var(--border-hover); }
      .tab-overflow-menu { position: absolute; top: 30px; right: 0; background: var(--surface); border: 1px solid var(--border-2); border-radius: var(--r); overflow-y: auto; max-height: 320px; min-width: 200px; z-index: 20; }
      .tab-overflow-menu div { display: flex; align-items: center; gap: 8px; padding: 6px 10px; cursor: pointer; font-size: 12px; color: var(--text-2); white-space: nowrap; }
      .tab-overflow-menu div:hover { background: var(--ghost-hover); }
      .tab-overflow-menu div.sel { color: var(--gc, var(--accent)); }
      .tab-overflow-menu .ovf-add { color: var(--text-2); }
      .tab-overflow-menu .ovf-sep { border-top: 1px solid var(--border-2); margin-top: 4px; padding-top: 8px; }
      .tab-overflow-menu .ovf-add svg { color: #9ab; flex: none; }
      .pane-body { flex: 1; min-height: 0; position: relative; display: flex; }
      .body-slot { position: absolute; inset: 0; }
      .tab.aux { background: var(--bg); border-color: var(--border); color: var(--text-3); }
      .tab.aux.act { background: var(--card); color: var(--text); border-color: var(--border-2); border-bottom-color: var(--gc, var(--accent)); }
      .drop-zone { flex: none; width: 180px; min-width: 120px; align-self: stretch; display: flex; align-items: center; justify-content: center; margin: 8px; border: 2px dashed var(--gc, var(--accent)); border-radius: var(--r-card); color: var(--gc, var(--accent)); font-size: 12px; background: var(--card); }
      .term-screen { flex: 1; min-width: 0; width: 100%; height: 100%; }

      /* Taskboard ADO : grille swimlanes (US figée à gauche) × colonnes d'états de tâches */
      .ado-taskboard { height: 100%; overflow: auto; padding: 0 10px 8px 0; }
      .ado-tb-head { display: grid; gap: 8px; position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 2px 0 6px; }
      .ado-tb-head-cell { font-size: 12px; color: var(--text-3); padding: 4px 6px; border-bottom: 1px solid var(--border); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .ado-tb-head-cell.swim { position: sticky; left: 0; background: var(--bg); z-index: 3; }
      .ado-swimlane { display: grid; gap: 8px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--border); }
      .ado-swim-head { position: sticky; left: 0; z-index: 1; background: var(--bg); display: flex; gap: 4px; align-items: flex-start; }
      .ado-tb-caret { background: none; border: none; color: var(--text-3); cursor: pointer; font-size: 12px; line-height: 1; padding: 4px 2px; }
      .ado-tb-cell { display: flex; flex-direction: column; gap: 6px; min-height: 8px; }
      .ado-us-card { flex: 1; min-width: 0; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--card); text-align: left; }
      .ado-task-card { text-align: left; }
      .ado-tb-expander { background: none; border: none; color: var(--text-3); cursor: pointer; font-size: 12px; padding: 2px 4px; display: inline-flex; align-items: center; gap: 4px; }
      .ado-tb-expander:hover { color: var(--gc, var(--accent)); }
      .ado-chevron { transition: transform .12s var(--ease); }
      .ado-chevron.down { transform: rotate(180deg); }
      .ado-swimlane.collapsed { display: flex; align-items: center; gap: 6px; padding: 6px 0; }
      .ado-swim-line { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; background: none; border: none; color: var(--text-2); cursor: pointer; font-family: inherit; font-size: 12px; text-align: left; overflow: hidden; }
      .ado-swim-line .ado-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      /* Détail plein-onglet d'un work item ADO */
      .ado-detail { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
      .ado-detail-head { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--surface); }
      .ado-back { background: var(--surface-2); border: 1px solid var(--border-2); border-radius: var(--r-sm); color: var(--text-2); cursor: pointer; padding: 4px 10px; font-family: inherit; font-size: 12px; transition: border-color var(--ease), color var(--ease); }
      .ado-back:hover { border-color: var(--gc, var(--accent)); color: var(--gc, var(--accent)); }
      .ado-detail-body { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 20px; max-width: 900px; }
      .ado-detail-title { font-size: 18px; margin: 0 0 12px; color: var(--text); }
      .ado-detail-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
      .ado-assignee-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
      .ado-chip-ini { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: var(--surface-2); color: var(--text); font-size: 10px; }
      .ado-meta-pill { font-size: 11px; color: var(--info); background: color-mix(in srgb, var(--info) 14%, transparent); border: 1px solid color-mix(in srgb, var(--info) 32%, transparent); border-radius: 10px; padding: 2px 8px; }
      .ado-detail-section { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: var(--text-3); margin: 18px 0 6px; border: none; border-bottom: 1px solid var(--border); padding: 0 0 4px; background: none; width: 100%; display: flex; align-items: center; gap: 6px; cursor: pointer; font-family: inherit; }
      .ado-detail-section:hover { color: var(--gc, var(--accent)); }
      .ado-twisty { flex: none; transition: transform .12s var(--ease); }
      .ado-twisty.open { transform: rotate(90deg); }
      .ado-html { font-size: 13px; line-height: 1.5; color: var(--text-2); }
      .ado-html img { max-width: 100%; height: auto; border-radius: 4px; }
      .ado-html table { border-collapse: collapse; }
      .ado-html td, .ado-html th { border: 1px solid var(--border-2); padding: 4px 8px; }
      .ado-html a { color: var(--info); }
      .ado-comment { border-top: 1px solid var(--border); padding: 8px 0; }
      .ado-comment-head { display: flex; gap: 10px; font-size: 11px; color: var(--info); margin-bottom: 4px; }
      .ado-comment-author { font-weight: 600; }
      .ado-comment-date { color: var(--text-muted); }

      .search-panel { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--surface); }
      .pane-body > .search-panel, .pane-body > .agents-tab { position: absolute; inset: 0; }
      .search-header { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--border); background: var(--surface); }
      .search-header input { flex: 1; background: var(--bg); border: 1px solid var(--border-2); border-radius: var(--r-sm); color: var(--text); font-family: inherit; font-size: 12px; padding: 4px 8px; outline: none; transition: border-color var(--ease); }
      .search-header input:focus { border-color: var(--ring); }
      .search-close { background: none; border: none; color: var(--text-3); cursor: pointer; font-size: 13px; padding: 2px 4px; }
      .search-close:hover { color: var(--err); }
      .search-summary { padding: 4px 8px; color: var(--text-muted); font-size: 11px; border-bottom: 1px solid var(--border); }
      .search-results { flex: 1; min-height: 0; overflow-y: auto; padding: 4px; }
      .search-msg { border: 1px solid var(--border); border-radius: var(--r-card); background: var(--card); margin: 8px; padding: 8px 10px; }
      .search-msg:has(.search-role.user) { background: var(--accent-soft); }
      .search-role { font-size: 10px; text-transform: uppercase; margin-bottom: 3px; color: var(--text-muted); letter-spacing: .04em; }
      .search-role.user { color: var(--info); }
      .search-role.assistant { color: var(--text-muted); }
      .search-text { color: var(--text-2); font-size: 11px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
      .search-text mark { background: color-mix(in srgb, var(--warn) 40%, transparent); color: #fff; border-radius: 2px; padding: 0 1px; }

      .splitter { flex: none; width: 5px; cursor: col-resize; background: var(--border); }
      .splitter:hover { background: var(--gc, var(--border-hover)); }
      .console { flex: 1; min-width: 0; overflow-y: auto; font-size: 12px; }
      .rail { width: 150px; border-left: 1px solid var(--border); overflow-y: auto; background: var(--surface); }
      .agents-tab { display: flex; flex: 1; min-width: 0; height: 100%; background: var(--surface); }
      .agents-tab .rail { border-left: none; border-right: 1px solid var(--border); flex: none; }
      .agents-tab .console { flex: 1; min-width: 0; overflow-y: auto; }
      .rail-empty { padding: 8px; color: var(--text-muted); font-size: 11px; }
      .console-empty { padding: 10px; color: var(--text-muted); font-size: 12px; }
      .agent { position: relative; padding: 6px 8px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 11px; transition: background var(--ease); }
      .agent:hover { background: var(--ghost-hover); }
      .agent.sel { background: var(--accent-soft); outline: 1px solid color-mix(in srgb, var(--gc, var(--accent)) 40%, transparent); }
      .agent .type { color: var(--purple); }
      .agent .desc { color: var(--text-2); }
      .agent.done .type { color: var(--text-muted); }
      .agent.done .desc { color: var(--text-muted); }
      .agent.failed .type { color: var(--err); }
      .abadge { display: inline-block; font-size: 8px; font-weight: 700; letter-spacing: .5px; line-height: 1; padding: 2px 4px; border-radius: 3px; vertical-align: middle; margin-right: 3px; }
      .abadge.agent { background: color-mix(in srgb, var(--purple) 16%, transparent); color: var(--purple); border: 1px solid color-mix(in srgb, var(--purple) 40%, transparent); }
      .abadge.shell { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); }
      .agent.done .abadge { opacity: .55; }
      .aclose { position: absolute; top: 4px; right: 6px; font-size: 10px; opacity: 0; cursor: pointer; color: var(--text-muted); user-select: none; }
      .agent:hover .aclose { opacity: 1; }
      .aclose:hover { color: var(--err); }
      .cline { white-space: pre-wrap; line-height: 1.4; }
      .cline.tool { color: var(--warn); }
      .cline.text { color: var(--text-2); }
      .cline.prompt { color: var(--text-3); }
      .cline.result { color: var(--text-3); }
      .console-header { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 5px 8px; background: var(--surface); border-bottom: 1px solid var(--border); color: var(--text-3); font-size: 11px; }
      .console-body { padding: 6px 8px; }
      .cclose { cursor: pointer; color: var(--text-muted); user-select: none; }
      .cclose:hover { color: var(--err); }
      .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 100; }
      .modal { background: var(--surface); border: 1px solid var(--border-2); border-radius: var(--r-card); min-width: 360px; max-width: 520px; max-height: 80vh; overflow: auto; box-shadow: 0 24px 60px -20px rgba(0,0,0,.8); }
      .modal-title { padding: 12px 16px; font-weight: bold; color: var(--text); border-bottom: 1px solid var(--border); }
      .modal-body { padding: 14px 16px; color: var(--text-2); font-size: 13px; }
      .modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--border); }
      .modal-msg { margin: 0 0 8px; color: var(--text-2); }
      .modal-list { margin: 6px 0 0; padding-left: 18px; color: var(--info); }
      .modal-list li { margin: 2px 0; }
      .btn { background: var(--card); border: 1px solid var(--border-2); border-radius: var(--r-btn); color: var(--text); cursor: pointer; padding: 5px 12px; font-family: inherit; font-size: 12px; transition: background var(--ease), border-color var(--ease); }
      .btn:hover { background: var(--ghost-hover); }
      .btn.primary { background: var(--accent); color: var(--accent-ink); border: 0; font-weight: 600; }
      .btn.primary:hover { filter: brightness(1.08); }
      .btn.danger { background: var(--err); color: #fff; border: 0; }
      .btn.danger:hover { filter: brightness(1.1); }
      .setting-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
      .setting-row:last-child { border-bottom: none; }
      .setting-label { flex: 1; }
      .setting-path { color: var(--text-3); font-size: 11px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .toggle { background: var(--card); border: 1px solid var(--border-2); border-radius: 12px; color: var(--text-3); cursor: pointer; padding: 3px 12px; font-family: inherit; font-size: 11px; transition: background var(--ease), border-color var(--ease), color var(--ease); }
      .toggle.on { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 45%, transparent); color: var(--text); }
      .swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; margin-bottom: 12px; }
      .swatch { width: 100%; aspect-ratio: 1; border: 2px solid transparent; border-radius: 6px; cursor: pointer; padding: 0; }
      .swatch.sel { border-color: var(--text); }
      .color-wheel-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; color: var(--text-2); font-size: 12px; }
      .color-wheel-row input[type=color] { width: 48px; height: 28px; background: none; border: 1px solid var(--border-2); border-radius: 6px; cursor: pointer; padding: 0; }
      .color-preview { display: flex; flex-direction: column; gap: 3px; }
      .cp-head { padding: 6px 10px; border-radius: 6px 6px 0 0; font-weight: bold; font-size: 12px; }
      .cp-item { padding: 5px 10px; font-size: 12px; }
      .settings-section-title { margin: 14px 0 4px; padding-top: 10px; border-top: 1px solid var(--border); font-weight: bold; color: var(--text); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
      .ado-empty { color: var(--text-muted); font-size: 12px; padding: 8px 0; }
      .ado-conn-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
      .ado-conn-label { font-weight: bold; color: var(--text-2); }
      .ado-conn-url { flex: 1; color: var(--info); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .ado-conn-status { color: var(--ok); font-size: 11px; }
      .ado-conn-edit { display: flex; flex-direction: column; gap: 8px; padding: 10px 0; }
      .ado-conn-edit-actions { display: flex; gap: 8px; }
      .ado-input { background: var(--bg); border: 1px solid var(--border-2); border-radius: var(--r-sm); color: var(--text); padding: 6px 10px; font-family: inherit; font-size: 12px; transition: border-color var(--ease); }
      .ado-input:focus { outline: none; border-color: var(--ring); }
      .muted { color: var(--text-muted); font-size: 11px; padding: 6px 0; }
      .setting-row > label { flex: 1; color: var(--text-2); font-size: 12px; }
      .setting-row > select { flex: 1.4; background: rgba(255,255,255,.03); border: 1px solid var(--border-2); border-radius: var(--r); color: var(--text); padding: 6px 10px; font-family: inherit; font-size: 12px; transition: border-color var(--ease), box-shadow var(--ease); }
      .setting-row > select:focus { outline: none; border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 22%, transparent); }
      .setting-row > select:disabled { opacity: 0.5; cursor: not-allowed; }
      .ado-board { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; }
      .ado-content { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
      .ado-center { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 16px; text-align: center; color: var(--text-muted); font-size: 12px; }
      .ado-board-bar { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-bottom: 1px solid var(--border); background: var(--surface); }
      .ado-refresh { display: inline-flex; align-items: center; justify-content: center; }
      .ado-spin-ico { display: inline-block; animation: ado-spin 0.7s linear infinite; }
      .ado-spinner { width: 18px; height: 18px; border: 2px solid var(--border-2); border-top-color: var(--warn); border-radius: 50%; animation: ado-spin 0.7s linear infinite; }
      .ado-refresh-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); animation: ado-blink 1s ease-in-out infinite; }
      @keyframes ado-spin { to { transform: rotate(360deg); } }
      @keyframes ado-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
      .ado-board-bar select { background: var(--bg); border: 1px solid var(--border-2); border-radius: var(--r-sm); color: var(--text); padding: 5px 8px; font-family: inherit; font-size: 12px; max-width: 240px; }
      .ado-board-bar select:focus { outline: none; border-color: var(--ring); }
      .ado-view-toggle { display: flex; flex: none; border: 1px solid var(--border-2); border-radius: var(--r-sm); overflow: hidden; }
      .ado-view-toggle button { background: var(--surface); border: none; border-right: 1px solid var(--border-2); color: var(--text-3); cursor: pointer; padding: 5px 10px; font-family: inherit; font-size: 12px; transition: background var(--ease), color var(--ease); }
      .ado-view-toggle button:last-child { border-right: none; }
      .ado-view-toggle button:hover { background: var(--ghost-hover); }
      .ado-view-toggle button.sel { background: var(--fill-active); color: var(--gc, var(--accent)); }
      .ado-board-err { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: color-mix(in srgb, var(--err) 14%, transparent); border-bottom: 1px solid color-mix(in srgb, var(--err) 32%, transparent); color: var(--err); font-size: 12px; }
      /* Barre de recherche in-board (Ctrl+F) */
      .ado-find-bar { flex: none; display: flex; align-items: center; gap: 6px; padding: 5px 8px; background: var(--surface); border-bottom: 1px solid var(--border); }
      .ado-find-input { flex: 1; background: var(--bg); border: 1px solid var(--border-2); border-radius: var(--r-sm); color: var(--text); padding: 5px 8px; font-family: inherit; font-size: 12px; transition: border-color var(--ease); }
      .ado-find-input:focus { outline: none; border-color: var(--ring); }
      .ado-find-count { flex: none; font-size: 11px; color: var(--text-muted); min-width: 36px; text-align: center; }
      .ado-find-btn { flex: none; padding: 4px 8px; }
      .ado-eye { flex: none; display: inline-flex; align-items: center; justify-content: center; padding: 4px 7px; color: var(--text-3); }
      .ado-eye.on { background: var(--fill-active); color: var(--gc, var(--accent)); border-color: var(--gc, var(--accent)); }
      mark.ado-hl { background: color-mix(in srgb, var(--warn) 35%, transparent); color: var(--text); border-radius: 2px; padding: 0 1px; }
      mark.ado-hl.active { background: var(--warn); color: var(--accent-ink); }
      .ado-find-more { position: relative; flex: none; }
      .ado-find-more-menu { position: absolute; right: 0; top: 100%; margin-top: 4px; background: var(--surface-2); border: 1px solid var(--border-2); border-radius: var(--r-sm); padding: 4px; z-index: 6; min-width: 150px; box-shadow: 0 4px 12px rgba(0,0,0,.4); }
      .ado-find-more-menu > div { padding: 6px 10px; font-size: 12px; color: var(--text-2); cursor: pointer; border-radius: 4px; }
      .ado-find-more-menu > div:hover { background: var(--ghost-hover); }
      .ado-find-more-menu > div.disabled { color: var(--text-muted); cursor: default; }
      .ado-find-more-menu > div.disabled:hover { background: none; }
      .ado-tree { flex: 1; overflow: auto; padding: 4px 0; }
      .ado-tree-empty { padding: 16px; text-align: center; color: var(--text-muted); font-size: 12px; }
      .ado-story { border-bottom: 1px solid var(--border); }
      .ado-row { display: flex; align-items: center; gap: 8px; padding: 5px 10px; font-size: 12px; cursor: default; transition: background var(--ease); }
      .ado-row.story { cursor: pointer; color: var(--text-2); }
      .ado-row:hover { background: var(--ghost-hover); }
      .ado-row.task { padding-left: 30px; color: var(--text-3); cursor: pointer; }
      .ado-caret { flex: none; width: 12px; text-align: center; color: var(--text-muted); }
      .ado-caret-btn { flex: none; width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; background: none; border: none; color: var(--text-3); cursor: pointer; padding: 0; }
      .ado-caret-btn:hover { color: var(--gc, var(--accent)); }
      .ado-id { flex: none; font-family: var(--mono); color: var(--text-3); }
      .ado-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .ado-state { flex: none; font-size: 10px; padding: 1px 6px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-3); }
      .ado-assignee { flex: none; color: var(--text-muted); font-size: 11px; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      /* Vue Board (colonnes par statut) */
      .ado-cols { flex: 1; display: flex; gap: 10px; overflow-x: auto; padding: 10px; align-items: flex-start; }
      .ado-col { flex: 0 0 240px; display: flex; flex-direction: column; background: rgba(255,255,255,.015); border: 1px solid var(--border); border-radius: var(--r-card); max-height: 100%; }
      .ado-col-head { flex: none; padding: 8px 10px; font-size: 12px; font-weight: 600; color: var(--text-2); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px; }
      .ado-col-count { font-size: 11px; color: var(--text-3); background: var(--surface-2); border-radius: 8px; padding: 0 6px; }
      .ado-col-body { overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
      .ado-card { text-align: left; background: var(--card); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 8px; cursor: pointer; color: var(--text-2); font-family: inherit; transition: background var(--ease), border-color var(--ease); }
      .ado-card:hover { background: var(--card-hover); border-color: var(--border-hover); }
      .ado-card-title { font-size: 12px; margin-bottom: 6px; line-height: 1.3; }
      .ado-card-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .ado-card-tasks { font-size: 11px; color: var(--info); }
      /* Drawer détail US */
      .ado-drawer-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.35); display: flex; justify-content: flex-end; z-index: 5; }
      .ado-drawer { width: 360px; max-width: 80%; background: var(--surface); border-left: 1px solid var(--border); height: 100%; overflow-y: auto; padding: 14px; box-shadow: -4px 0 16px rgba(0,0,0,.4); }
      .ado-drawer-head { display: flex; align-items: center; gap: 8px; }
      .ado-drawer-x { margin-left: auto; background: none; border: none; color: var(--text-3); cursor: pointer; font-size: 14px; }
      .ado-drawer-x:hover { color: var(--text); }
      .ado-drawer-title { font-size: 14px; color: var(--text); margin: 10px 0 6px; }
      .ado-drawer-meta { display: flex; gap: 12px; color: var(--text-muted); font-size: 11px; margin-bottom: 12px; }
      .ado-drawer-section { font-size: 12px; font-weight: 600; color: var(--text-2); border-top: 1px solid var(--border); padding-top: 10px; margin-bottom: 6px; }
      .ado-drawer-task { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 12px; border-bottom: 1px solid var(--border); }

      /* ----- Lecteur Notes / Markdown ----- */
      .notes-view { position: absolute; inset: 0; display: flex; flex-direction: column; min-height: 0; background: var(--bg); }
      .notes-bar { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--border); flex: none; }
      .notes-bar .btn { background: var(--surface-2); border: 1px solid var(--border-2); color: var(--text-2); border-radius: var(--r-sm); cursor: pointer; padding: 2px 8px; font-family: inherit; transition: border-color var(--ease), color var(--ease); }
      .notes-bar .btn:hover:not(:disabled) { color: var(--text); border-color: var(--border-hover); }
      .notes-bar .btn:disabled { opacity: .4; cursor: default; }
      .notes-crumb { color: var(--text-3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .notes-body { flex: 1; min-height: 0; display: flex; overflow: hidden; }
      .notes-tree { width: 240px; min-width: 180px; flex: none; overflow: auto; background: var(--surface); border-right: 1px solid var(--border); padding: 6px 0; }
      .notes-content { flex: 1; min-width: 0; overflow: auto; background: var(--bg); }
      .notes-center { padding: 24px; color: var(--text-3); text-align: center; }
      .notes-err { color: var(--err); }
      .nt-row { display: flex; align-items: center; gap: 5px; padding: 3px 8px; cursor: pointer; font-size: 12px; color: var(--text-2); white-space: nowrap; }
      .nt-row:hover { background: var(--ghost-hover); }
      .nt-row.file.active { background: var(--fill-active); color: var(--text); }
      .nt-ic { display: inline-flex; color: #9bd; flex: none; }
      .nt-name { overflow: hidden; text-overflow: ellipsis; }

      .md-view { padding: 18px 26px; max-width: 860px; margin: 0 auto; color: var(--text-2); font-family: var(--sans); line-height: 1.6; font-size: 14px; }
      .md-view h1, .md-view h2 { border-bottom: 1px solid var(--border); padding-bottom: .2em; }
      .md-view h1, .md-view h2, .md-view h3, .md-view h4, .md-view h5, .md-view h6 { line-height: 1.3; margin: 1.2em 0 .5em; color: var(--text); }
      .md-view a, .md-view .md-link { color: var(--info); cursor: pointer; text-decoration: none; }
      .md-view a:hover, .md-view .md-link:hover { text-decoration: underline; }
      .md-view .wikilink-missing { color: var(--err); border-bottom: 1px dashed var(--err); cursor: default; }
      .md-view img { max-width: 100%; border-radius: var(--r-sm); }
      .md-view code { background: var(--surface-2); padding: .12em .35em; border-radius: var(--r-sm); font-family: var(--mono); font-size: .92em; }
      .md-view pre { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 12px 14px; overflow: auto; }
      .md-view pre code { background: none; padding: 0; }
      .md-view blockquote { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-sm); margin: .6em 0; padding: .4em 1em; color: var(--text-3); }
      .md-view table { border-collapse: collapse; margin: .8em 0; display: block; overflow: auto; }
      .md-view th, .md-view td { border: 1px solid var(--border); padding: 6px 10px; }
      .md-view th { background: var(--surface-2); color: var(--text-muted); }
      .md-view hr { border: none; border-top: 1px solid var(--border); margin: 1.4em 0; }
      .md-view li.task-item { list-style: none; margin-left: -1.2em; }
      .md-view li.task-item input { margin-right: 6px; }
      .md-view .callout { border: 1px solid color-mix(in srgb, var(--info) 26%, var(--border)); border-radius: var(--r); padding: 8px 12px; margin: .8em 0; background: color-mix(in srgb, var(--info) 9%, transparent); }
      .md-view .callout-title { font-weight: bold; color: var(--info); margin-bottom: 4px; }
      .md-view .callout-warning, .md-view .callout-caution { border-color: color-mix(in srgb, var(--warn) 26%, var(--border)); background: color-mix(in srgb, var(--warn) 9%, transparent); }
      .md-view .callout-warning .callout-title, .md-view .callout-caution .callout-title { color: var(--warn); }
      .md-view .callout-danger, .md-view .callout-error, .md-view .callout-bug { border-color: color-mix(in srgb, var(--err) 26%, var(--border)); background: color-mix(in srgb, var(--err) 9%, transparent); }
      .md-view .callout-danger .callout-title, .md-view .callout-error .callout-title, .md-view .callout-bug .callout-title { color: var(--err); }
      .md-view .callout-tip, .md-view .callout-success, .md-view .callout-note { border-color: color-mix(in srgb, var(--info) 26%, var(--border)); background: color-mix(in srgb, var(--info) 9%, transparent); }
      .md-view .callout-tip .callout-title, .md-view .callout-success .callout-title, .md-view .callout-note .callout-title { color: var(--info); }
      .md-view .md-embed { border: 1px dashed var(--border-2); border-radius: var(--r); padding: 8px 12px; margin: .8em 0; background: var(--card); }
      .md-view .md-embed .embed-title { color: var(--text-3); font-size: 12px; margin-bottom: 6px; }
      /* highlight.js — thème sombre minimal */
      .hljs-comment, .hljs-quote { color: #6a9955; }
      .hljs-keyword, .hljs-selector-tag, .hljs-built_in { color: #569cd6; }
      .hljs-string, .hljs-attr { color: #ce9178; }
      .hljs-number, .hljs-literal { color: #b5cea8; }
      .hljs-title, .hljs-function, .hljs-name { color: #dcdcaa; }
      .hljs-type, .hljs-class { color: #4ec9b0; }
      .hljs-variable, .hljs-template-variable { color: #9cdcfe; }

      .img-view { width: 100%; height: 100%; overflow: auto; display: flex; justify-content: center; align-items: flex-start; padding: 16px; box-sizing: border-box; }
      .img-view img { max-width: 100%; height: auto; }
      .html-view { width: 100%; height: 100%; border: 0; background: #fff; }
      .nt-emoji { font-size: 13px; line-height: 1; }

      /* Focus clavier visible, cohérent sur les contrôles interactifs natifs */
      button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }

      /* Respect de la préférence "mouvement réduit" : neutralise les animations décoratives */
      @media (prefers-reduced-motion: reduce) {
        .blink, .pulse, .ado-spin-ico, .ado-spinner, .ado-refresh-dot { animation: none !important; }
      }
    </style>
  </head>
